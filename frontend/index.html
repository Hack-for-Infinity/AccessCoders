<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccessScholar</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>AccessScholar</h1>
<p>Accessible Scholarship Platform for Students with Disabilities</p>
</header>

<section class="search-section">

<input 
type="text" 
id="searchInput"
placeholder="Search scholarships..."
>

<select id="filter">
<option value="">All Scholarships</option>
<option value="disability">Disability Support</option>
<option value="merit">Merit Based</option>
<option value="financial">Financial Aid</option>
</select>

<button id="searchBtn">Search</button>

</section>

<section id="scholarshipList">

<div class="card">
<h3>Google Disability Scholarship</h3>
<p>Supports students with disabilities in technology fields.</p>
</div>

<div class="card">
<h3>Microsoft Accessibility Grant</h3>
<p>Financial support for students with accessibility needs.</p>
</div>

</section>

<script src="search.js"></script>

</body>
</html>
