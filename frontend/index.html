<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccessScholar</title>
<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/opendyslexic.css" rel="stylesheet">
</head>

<body>

<header>
<h1>AccessScholar</h1>
<p>Accessible Scholarship Platform for Students with Disabilities</p>
</header>
<section class="hero">

<img 
src="assets/students.png" 
alt="Group of diverse students studying together including a wheelchair user, representing inclusive education and scholarship opportunities for students with disabilities"
class="hero-image">

</section>
<section class="search-section">

<input 
type="text" 
id="searchInput"
aria-label="Search scholarships..."
>

<select id="filter" aria-label="Filter-Scholarships">
<option value="">All Scholarships</option>
<option value="disability">Disability Support</option>
<option value="merit">Merit Based</option>
<option value="financial">Financial Aid</option>
</select>

<button id="searchBtn">Search</button>

</section>

<section id="scholarshipList"></section>


<script src="search.js"></script>

<div id="accessibility-btn"
role="button"
aria-label="Open accessibility menu"
tabindex="0">
♿
</div>

<div id="accessibility-panel"
role="dialog"
aria-label="Accessibility Settings">

<h3>Accessibility</h3>

<button id="darkMode">Dark Mode</button>

<button id="contrastMode">High Contrast</button>

<button id="dyslexiaMode">Dyslexia Font</button>

<button id="highlightLinks">Highlight Links</button>

<button id="readPage">Text To Speech</button>

<button id="stopReading">Stop Reading</button>
<button id="voiceControl">Voice Navigation</button>
<button id="toggleImages">Toggle Images</button>
<button id="describeImages">Describe Images</button>
<label for="fontSlider">Font Size</label>

<input type="range" id="fontSlider" min="16" max="26">


<button id="resetAccessibility">Reset</button>

</div>

<script src="accessibility.js"></script>
</body>
</html>
